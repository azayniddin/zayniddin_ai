<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#181c2e"/>
      <stop offset="60%" stop-color="#0b0e17"/>
      <stop offset="100%" stop-color="#05070c"/>
    </radialGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="35%" stop-color="#4facfe"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Core Glow Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0b0e17" stop-opacity="0"/>
    </radialGradient>

    <!-- Neural Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Subtle Ambient Glow Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ringGrad)" stroke-width="6" stroke-opacity="0.25" stroke-dasharray="8 6"/>

  <!-- Core Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="url(#coreGlow)"/>

  <!-- Futuristic Cybernetic Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="12" filter="url(#neonGlow)" stroke-linecap="round"/>

  <!-- Orbital Satellites -->
  <circle cx="256" cy="96" r="10" fill="#00f2fe" filter="url(#neonGlow)"/>
  <circle cx="396" cy="336" r="8" fill="#f43f5e" filter="url(#neonGlow)"/>
  <circle cx="116" cy="336" r="8" fill="#a855f7" filter="url(#neonGlow)"/>

  <!-- Stylized Z Monogram & Neural Core -->
  <g filter="url(#neonGlow)">
    <!-- Main Z Shape -->
    <path d="M 170 180 L 342 180 L 170 332 L 342 332" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Inner High-Tech Circuit Accent -->
    <path d="M 210 216 L 310 216 L 202 306 L 302 306" 
          fill="none" 
          stroke="url(#ringGrad)" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Central AI Spark -->
    <circle cx="256" cy="256" r="12" fill="#00f2fe"/>
    <circle cx="256" cy="256" r="5" fill="#ffffff"/>
  </g>
</svg>
